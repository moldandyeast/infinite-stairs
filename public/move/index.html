<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Strange Loop Parade: an endless marching band climbing an impossible Penrose stair, cut to a drone soundtrack with slot-machine and anime effects. By RM.">
<meta property="og:title" content="Strange Loop Parade · Move">
<meta property="og:description" content="Conduct the endless marching band with your body. Camera stays on your device. By RM.">
<meta property="og:url" content="https://infinite-stairs.moldandyeast.com/move/">
<meta name="twitter:creator" content="@nilsedison">
<title>Strange Loop Parade · Move</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--ink:#1A0B2E;--gold:#FFCB3D;--pink:#FF3D6E;--paper:#FFF3E4}
html,body{height:100%}
body{margin:0;background:#12071F;overflow:hidden}
#cv{display:block;width:100%;height:100%}
#go[hidden]{display:none}
#go{z-index:4;position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 20px 12px 16px;border-radius:999px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);cursor:pointer;font:400 18px/1 Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 0 3px var(--gold),0 8px 0 var(--ink),0 0 40px rgba(255,203,61,.7);animation:bob .5s ease-in-out infinite alternate}
#go i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--gold);font-size:14px}
#go:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
@keyframes bob{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.07)}}
@media (prefers-reduced-motion: reduce){#go{animation:none}}
#snd{display:none}
#deckBtn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px 14px;border-radius:999px;border:2px solid var(--gold);background:rgba(26,11,46,.85);color:var(--gold);font:700 12px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;z-index:3}
#deckBtn:focus-visible,#deck button:focus-visible,#deck input:focus-visible,.knob:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
#deck{position:fixed;left:0;right:0;bottom:0;max-height:min(62vh,560px);overflow:auto;background:rgba(18,7,31,.93);border-top:3px solid var(--gold);box-shadow:0 -10px 40px rgba(0,0,0,.5);padding:10px max(14px,env(safe-area-inset-left)) calc(64px + env(safe-area-inset-bottom,0px));color:var(--paper);z-index:2;backdrop-filter:blur(6px)}
#deck[hidden]{display:none}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:8px}
.dh b{font:400 18px/1 Anton,Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.dh-r{display:flex;gap:6px;flex-wrap:wrap}
.db{font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:transparent;border:1.5px solid rgba(255,243,228,.5);border-radius:6px;padding:8px 10px;cursor:pointer}
.db:hover{border-color:var(--gold);color:var(--gold)}
.db[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
#dRand{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.dgrid{display:flex;flex-wrap:wrap;gap:10px}
.grp{border:1.5px solid rgba(255,203,61,.35);border-radius:10px;padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.grp>span{font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.knobs{display:flex;flex-wrap:wrap;gap:4px}
.knob{width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:ns-resize;touch-action:none;user-select:none;border-radius:8px;padding:2px 0}
.knob svg{width:46px;height:46px;display:block}
.knob em{font:700 9.5px/1.1 "JetBrains Mono",monospace;font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,243,228,.85);text-align:center}
.knob b{font:500 10px/1 "JetBrains Mono",monospace;color:var(--gold);font-variant-numeric:tabular-nums}
.drow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.dl{font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);min-width:64px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-radius:6px;border:1.5px solid rgba(255,243,228,.4);background:transparent;color:var(--paper);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
#dWords{flex:1 1 240px;min-width:0;font:500 13px/1.2 "JetBrains Mono",monospace;padding:9px 10px;border-radius:6px;border:1.5px solid rgba(255,243,228,.4);background:rgba(255,243,228,.06);color:var(--paper)}
#snd-old{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:rgba(26,11,46,.8);color:var(--paper);font:700 16px/1 "JetBrains Mono",monospace;cursor:pointer}
#snd:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#byline{z-index:5;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 10px;pointer-events:none;font:700 11px/1.3 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);text-align:center}
#byline>*{pointer-events:auto;display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(26,11,46,.82);border:1.5px solid rgba(255,203,61,.6);backdrop-filter:blur(6px)}
#byline a{color:var(--gold);text-decoration:none}
#byline a:hover{color:var(--pink);border-color:var(--pink)}
#byline a:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
@media (max-width:480px){#byline{font-size:10px;gap:4px 6px}#byline>*{padding:5px 8px}}
#go small{display:block;font:500 10px/1.2 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:none;opacity:.8;margin-top:4px}
#go{flex-direction:column;align-items:center;gap:0;padding:12px 22px}
#go i{margin-bottom:6px}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px}
#bodyBtn{position:fixed;right:calc(max(14px,env(safe-area-inset-right)) + 104px);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px 14px;border-radius:999px;border:2px solid var(--pink);background:rgba(26,11,46,.85);color:var(--pink);font:700 12px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;z-index:3}
#bodyBtn[aria-pressed="true"]{background:var(--pink);color:#fff}
#bodyBtn:disabled{opacity:.6;cursor:progress}
#bodyBtn:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
#pip{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:160px;height:120px;border-radius:10px;border:2px solid var(--gold);background:rgba(26,11,46,.75);z-index:3;opacity:0;transition:opacity .4s;pointer-events:none}
#pip.on{opacity:1}
#pip.hide{opacity:0}
#bodyMsg{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);padding:8px 14px;border-radius:8px;background:rgba(26,11,46,.9);border:1.5px solid var(--gold);color:var(--paper);font:500 12px/1.4 "JetBrains Mono",monospace;text-align:center;z-index:4}
#bodyMsg[hidden]{display:none}
.knob.live{pointer-events:none;position:relative}
.knob.live::after{content:"";position:absolute;top:2px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}
.knob.live em{color:var(--pink)}
body:has(#deck:not([hidden])) #pip{bottom:auto;top:calc(56px + env(safe-area-inset-top,0px))}
@media (max-width:700px){body:has(#deck:not([hidden])) #pip{opacity:0}}
@media (max-width:480px){#pip{width:120px;height:90px}}
</style>
</head>
<body>
<header id="byline" aria-label="Credits">
  <span>by RM</span>
  <a href="https://content.moldandyeast.com" rel="noopener">Visit content.moldandyeast.com for more</a>
  <a href="https://twitter.com/nilsedison" rel="noopener" target="_blank">Follow @nilsedison on Twitter</a>
  <a href="https://github.com/moldandyeast/infinite-stairs" rel="noopener" target="_blank">Source on GitHub</a>
  <a href="/" rel="noopener">Classic ↗</a>
</header>
<canvas id="cv" role="img" aria-label="Strange Loop Parade: an endless marching band climbing an impossible Penrose stair, cut to a drone soundtrack with slot-machine and anime effects."></canvas>
<button id="go" aria-label="Turn on the sound and the camera"><i>▶</i>Tap for sound + camera<small>Camera stays on your device</small></button>
<video id="cam" playsinline muted aria-hidden="true"></video>
<button id="bodyBtn" aria-pressed="false" title="Drive the knobs with your body (B)">◉ Body</button>
<canvas id="pip" width="160" height="120" aria-label="Your tracked skeleton, mirrored"></canvas>
<p id="bodyMsg" role="status" hidden></p>
<button id="deckBtn" aria-expanded="false" aria-controls="deck">◉ Knobs</button>
<section id="deck" hidden aria-label="Control deck">
  <div class="dh"><b>Strange Loop Parade · control deck</b><span class="dh-r"><button class="db" id="dRand" title="Randomize every knob (R)">Randomize</button><button class="db" id="dReset" title="Back to the default loop">Reset</button><button class="db" id="dMute" aria-pressed="false">Mute</button><button class="db" id="dHide" title="Hide the deck (K)">Hide</button></span></div>
  <div class="dgrid" id="dgrid"></div>
  <div class="drow"><span class="dl">Picture</span><div class="seg" id="dMode" role="group" aria-label="Picture mode"></div></div>
  <div class="drow"><label class="dl" for="dWords">Words</label><input id="dWords" type="text" maxlength="400" placeholder="Type your own slam words, one per beat" autocomplete="off" spellcheck="false"></div>
</section>
<script src="/parade.js"></script>
<script type="module" src="/move/move.js"></script>

</body></html>
